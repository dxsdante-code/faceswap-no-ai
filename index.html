<!-- index.html updated: removed MediaPipe and keep OpenCV.js + note for model -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FaceSwap Pro (YuNet) — Cliente</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>FaceSwap Pro (YuNet)</h1>
        <p class="tag">Client-side • OpenCV.js (YuNet) • Offline</p>
      </header>

      <main class="main">
        <section class="left">
          <div class="card">
            <h2>Entradas</h2>
            <div class="drop-area" id="dropSource">Arrastra o pega (Ctrl+V) imagen fuente</div>
            <input id="sourceInput" type="file" accept="image/*" />
            <canvas id="sourcePreview" class="preview"></canvas>
          </div>

          <div class="card">
            <h2>Destino</h2>
            <div class="drop-area" id="dropTarget">Arrastra o pega (Ctrl+V) imagen destino</div>
            <input id="targetInput" type="file" accept="image/*" />
            <canvas id="targetPreview" class="preview"></canvas>
          </div>

          <div class="card small">
            <h3>Controles rápidos</h3>
            <label>Modo múltiple <input id="multiToggle" type="checkbox" /></label>
            <label>Auto-align <input id="autoAlign" type="checkbox" checked /></label>
            <label>Feather <input id="featherRange" type="range" min="0" max="50" value="12" /></label>
            <label>Blend <input id="blendRange" type="range" min="0" max="1" step="0.01" value="1" /></label>
            <div class="buttons">
              <button id="swapBtn" class="primary">Aplicar FaceSwap</button>
              <button id="undoBtn">Deshacer</button>
              <button id="redoBtn">Rehacer</button>
              <select id="exportFormat"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select>
              <button id="downloadBtn" class="secondary">Descargar</button>
            </div>
          </div>
        </section>

        <section class="right">
          <div class="card">
            <h2>Resultado</h2>
            <div class="result-area">
              <canvas id="resultCanvas" class="result"></canvas>
              <div id="statusBar" class="status">Listo</div>
            </div>

            <div class="compare">
              <label><input id="compareToggle" type="checkbox" /> Mostrar antes/después (slider)</label>
              <div id="compareWrap" class="compare-wrap" aria-hidden="true">
                <canvas id="compareBefore"></canvas>
                <canvas id="compareAfter"></canvas>
                <input id="compareSlider" type="range" min="0" max="100" value="50" />
              </div>
            </div>

            <div class="thumbnails" id="thumbs"></div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <small>Hecho con OpenCV.js YuNet — Todo en el navegador. No se suben imágenes.</small>
      </footer>
    </div>

    <!-- OpenCV.js (async) -->
    <script async src="https://docs.opencv.org/4.7.0/opencv.js" onload="window.onOpenCvReady && window.onOpenCvReady()"></script>
    <!-- App modules -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
